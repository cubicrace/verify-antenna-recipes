---
version: 26.09
logging:
  level: info

auditing:
  enabled: false

telemetry:
  otel_service_name: "antenna" # This variable specifies the name of the service associated with the span generated by the IBM Verify Antenna.
  otel_service_version: "26.09" # This variable controls the service version that will be emitted in traces
  otel_sdk_disabled: true # Setting this variable to true completely disables the OpenTelemetry at runtime. No telemetry is generated, no data is exported, reducing any performance overhead.
  otel_resource_attributes: "deployment.env.type=production,deployment.region.name=sg" # This varible controls the resource attributes that can be added as contextual metadata to your telemetry. They're key-value pairs.
  otel_exporter_endpoint: "https://localhost:4318" # This variable tells the OpenTelemetry SDK where to send telemetry data. The OpenTelemetry Protocol (OTLP) is the standard wire format.
  otel_exporter_otlp_protocol: "http" # This variable sets the transport protocol for all telemetry signals. Only http is supported
  otel_exporter_otlp_insecure: true # This variable specifies the TLS encryption for OTLP exports.
  otel_exporter_otlp_headers: "" # This adds custom metadata headers to every OTLP request sent by the SDK, most commonly used for authentication. Multiple headers can be set by separating them with commas. For example OTEL_EXPORTER_OTLP_METRICS_HEADERS="api-key=your_secret_token,tenant-id=tryisv"
  otel_exporter_otlp_certificate: "" # The trusted certificate to use when verifying a server’s TLS credentials. This should only be specified when establishing a secure (TLS) connection.
  otel_exporter_otlp_client_certificate: "" # Client certificate or certificate chain (in PEM format) used to authenticate the client's private key in mutual TLS (mTLS) communication. Must be used in conjunction with the variable OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY / OTEL_EXPORTER_OTLP_CLIENT_KEY.
  otel_exporter_otlp_client_key: "" # Client’s private key (in PEM format) used for mutual TLS (mTLS) communication. Must be used in conjunction with the variable OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE or OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE.
  otel_exporter_otlp_compression: "gzip" # This variable enables payload compression for OTLP exports. The only widely supported value is gzip
  otel_exporter_otlp_timeout: 10000 # This variable controls how long the exporter waits for each batch export to complete before timing out. The default, is 10,000 milliseconds (10 seconds)
  otel_metric_export_interval: 5000 # This variable controls how frequently the SDK's periodic metric reader collects and exports metrics. The default is 60000 (60 seconds)
  otel_bsp_schedule_delay: 5000  # This variable controls how long the processor waits between consecutive exports. The default is 5000 (5 seconds). Lowering this value means your trace data appears in your backend more quickly, but at the cost of more frequent network calls.
  otel_bsp_max_export_batch_size: 512  # This variable caps the number of spans sent in a single export request. If your service generates spans rapidly, the processor will trigger an export as soon as this limit is reached, even if the schedule delay hasn't elapsed yet.
  otel_bsp_max_queue_size: 2048  # This variable defines the total number of spans that can be buffered in memory. The default is 2048. This is a safety measure, if the exporter falls behind (because the backend is slow, the network is congested, or the export is timing out), spans accumulate in this queue. Once the queue is full, new spans are silently dropped.

receiver:
  server: # HTTP server.
    ssl: # SSL cert / key for HTTPS
      key: "ks:server/key"
      certificate: "ks:server/cert"
  base_url: "https://receiver.dune.com:9043"

  preserve_headers: 
    - "X-Correlation-Id"

  management:
    enabled: true

  auditing:
    enabled: true

  runtime:
    enabled: true

    # The number of worker threads processing the received events.
    worker_threads: 10

    # clean events periodically
    cleaner_interval_in_secs: 60
    event_states_to_clean:
      - "actioned"
      - "errored"

    action_rules:
      - event_type: "https://schemas.openid.net/secevent/caep/event-type/session-revoked"
        type: javascript
        content: "@js/log_event.js"
      - event_type: "https://schemas.openid.net/secevent/caep/event-type/device-compliance-change"
        type: javascript
        content: "@js/log_event.js"
      - event_type: "https://iam.ibm.com/secevent/ssf/event-type/application"
        type: javascript
        content: "@js/log_event.js"

# js engine configuration
javascript:
  timeout: 10
  max_concurrent_jobs: 16
  max_ctx_pre_isolate: 50